# ╔════════════════════════════════════════════════════════════════════╗
# ║  Bob & Berry — everything the website shows lives in this file.    ║
# ╚════════════════════════════════════════════════════════════════════╝
#
#  After editing, rebuild:      python build.py
#  Then upload the public/ folder again (see README.md).
#
#  Rules of thumb
#   • Text that differs by language is written   { en = "…", he = "…" }
#   • To hide an optional field, delete the line or leave it empty ("").
#     Empty optional fields disappear from the page — nothing is shown
#     as "unknown".
#   • Phone numbers go in international format, e.g. "+972-54-3123061".
#   • NEVER change a dog's `slug` after the NFC tags are written:
#     it is the permanent collar address (/bob/ and /berry/).
#   • Only publish what you are happy for any stranger to read.
#     No street address, no full microchip number.


# ─── Site ──────────────────────────────────────────────────────────────
[site]
# The permanent public address, WITHOUT a trailing slash,
# e.g. "https://bobandberry.com" or "https://bob-and-berry.pages.dev".
# Leave empty until the site is live on its lasting address. Once it is
# set, `python build.py` also writes nfc-kit/ with the exact collar URLs
# and printable QR codes.
base_url = "https://bob-and-berry.vercel.app"
name = { en = "Bob & Berry", he = "בוב וברי" }


# ─── Owner (main contact) ──────────────────────────────────────────────
[owner]
name          = { en = "Roy Even", he = "רועי אבן" }
short_name    = { en = "Roy", he = "רועי" }   # used on buttons: "Call Roy"
gender        = "m"                         # m | f — only used for Hebrew grammar
phone         = "+972-54-3123061"           # REQUIRED — Call and SMS buttons
phone_display = "054-312-3061"              # how the number is written on the page
whatsapp      = "+972-54-3123061"           # empty → WhatsApp buttons are hidden
email         = "roy3v3n@gmail.com"         # empty → hidden
home_area     = { en = "Holon", he = "חולון" }  # city only, never a street address


# ─── Backup contact (optional) ─────────────────────────────────────────
# Delete this whole section to hide it.
[backup]
name          = { en = "Yana Grischenko", he = "יאנה גרישצ'נקו" }
short_name    = { en = "Yana", he = "יאנה" }
gender        = "f"
phone         = "+972-52-475-5641"
phone_display = "052-475-5641"
whatsapp      = ""                          # add the number if Yana is reachable on WhatsApp
email         = "yanagrishchenko.yg@gmail.com"


# ─── Dogs ──────────────────────────────────────────────────────────────
# Each [[dogs]] block is one dog page. Photos: put the original files in
# photos/<slug>/ and list them below; the FIRST photo is the main
# portrait. 4–5 photos per dog work best. The build resizes them and
# strips all hidden metadata (including GPS location).
#
# `focus` (optional) = the part of the photo to keep visible when it is
# cropped into a square-ish frame: "horizontal% vertical%".

[[dogs]]
slug      = "bob"                            # collar URL → /bob/  (never change)
name      = { en = "Bob", he = "בוב" }
sex       = "male"                           # male | female
accent    = "#A15B1C"                        # this dog's small colour accent
born      = "2022-03-22"                     # YYYY-MM-DD — age is calculated automatically
breed     = { en = "Labrador mix", he = "לברדור מעורב" }
size      = { en = "Large", he = "גדול" }
weight_kg = 34
coat      = { en = "Brown", he = "חום" }
markings  = { en = "", he = "" }             # distinctive marks that tell Bob apart
temperament  = { en = "Friendly and approachable.", he = "ידידותי ואפשר לגשת אליו." }
with_dogs    = { en = "Gets along with other dogs.", he = "מסתדר עם כלבים אחרים." }
with_animals = { en = "Not comfortable around other animals.", he = "לא מרגיש בנוח ליד בעלי חיים אחרים." }
medical      = { en = "", he = "" }          # medication or conditions a finder must know
# Owner-confirmed alerts — shown right under the contact buttons.
alerts = [
  { en = "Scared of loud sounds, electric motors and similar noises.", he = "מפחד מרעשים חזקים, ממנועים חשמליים ומרעשים דומים." },
]

  [[dogs.photos]]
  file  = "bob/sitting.jpg"
  alt   = { en = "Bob sitting on a tiled floor, looking up at the camera", he = "בוב יושב על רצפת אריחים ומביט למעלה אל המצלמה" }
  focus = "50% 52%"

  [[dogs.photos]]
  file  = "bob/sofa.jpg"
  alt   = { en = "Bob lying on a blue sofa, looking back over his shoulder", he = "בוב שוכב על ספה כחולה ומביט לאחור מעבר לכתף" }
  focus = "30% 30%"

  [[dogs.photos]]
  file  = "bob/resting.jpg"
  alt   = { en = "Bob resting his head on the floor next to a sofa", he = "בוב מניח את הראש על הרצפה ליד ספה" }
  focus = "30% 50%"

  [[dogs.photos]]
  file  = "bob/hallway.jpg"
  alt   = { en = "Bob sitting on a grey rug in a hallway, seen from behind", he = "בוב יושב על שטיח אפור במסדרון, מצולם מאחור" }
  focus = "45% 50%"


