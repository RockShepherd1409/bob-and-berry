# ─── Interface wording ─────────────────────────────────────────────────
# You rarely need to touch this. Placeholders in {braces} are filled in
# automatically:
#   {name}  the dog (or "Bob and Berry" on the homepage)
#   {to}    the person being contacted, e.g. Roy
#   {owner} Roy's short name (the main contact)
#   {n} {i} {total} {date} {items}  numbers / values
# Hebrew variants: `he_f` is used instead of `he` when the subject is
# female (the dog in dog sentences; the contact person in messages).

[ui]
page_title      = { en = "{name} — help me get home", he = "{name} — עזרו לי לחזור הביתה" }
language        = { en = "Language", he = "שפה" }
home_link       = { en = "Bob & Berry home", he = "לעמוד הבית של בוב וברי" }
more_pages      = { en = "More pages", he = "עמודים נוספים" }
eyebrow         = { en = "Help me get home", he = "עזרו לי לחזור הביתה" }
greeting        = { en = "Hi, I'm {name}", he = "היי, אני {name}" }
found_q         = { en = "Found me on my own?", he = "מצאתם אותי לבד?" }
found_a         = { en = "Please contact my family.", he = "בבקשה צרו קשר עם המשפחה שלי." }
thanks          = { en = "Thank you for helping me get home.", he = "תודה שאתם עוזרים לי לחזור הביתה." }

call            = { en = "Call {to}", he = "התקשרו ל{to}" }
whatsapp        = { en = "WhatsApp {to}", he = "שלחו הודעה ל{to} בוואטסאפ" }
whatsapp_short  = { en = "WhatsApp {to}", he = "וואטסאפ ל{to}" }
sms             = { en = "SMS {to}", he = "SMS ל{to}" }
email           = { en = "Email {to}", he = "מייל ל{to}" }
copy_number     = { en = "Copy number", he = "העתקת המספר" }
copied          = { en = "Number copied.", he = "המספר הועתק." }
copy_failed     = { en = "Couldn't copy automatically. The number is now selected — press and hold it to copy.", he = "ההעתקה האוטומטית לא הצליחה. המספר מסומן עכשיו — לחצו עליו לחיצה ארוכה כדי להעתיק." }
